<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Carros e Bicicletas</title>
	<link rel="stylesheet" href="./css/style.css">
</head>
<body>
	<h1>Carros e Bicicletas</h1>

	<div class="container">
		<h2>Carro: <span class="highlight">R$ 1999</span></h2>
		<p>Carro modelo <span class="highlight">2045</span>, com <span class="highlight">200km</span> rodados.</p>
		<button class="botao">Comprar Carro</button>
	</div>

	<div class="container">
		<h2>Bicicleta: <span class="highlight">R$ 199</span></h2>
		<p>Bicicleta modelo <span class="highlight">2050</span>, com <span class="highlight">20km</span> rodados.</p>
		<button class="botao">Comprar Bicicleta</button>
	</div>
</body>
</html>
